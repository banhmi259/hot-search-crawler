name: live

# 高频实时发布：由外部定时器每 10 分钟触发 workflow_dispatch。
# 只把最新快照发布到 GitHub Pages，不写回 git，避免仓库历史膨胀。
on:
  schedule:
    # 外部定时器未配置时的低频兜底；配置后仍保留，频率远低于 10 分钟。
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# 不要取消在途的 Pages 部署：被取消的 deploy-pages 会在 Pages 侧留下
# in_progress 的部署，导致后续运行持续报 "in progress deployment"。
# 排队时 GitHub 只保留最新一个 pending run，不会积压。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Crawl live snapshot
        run: go run ./cmd/hot-search-crawler crawl --live --data dist

      - name: Add index redirect
        run: |
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=latest.json"><title>hot-search-crawler</title><a href="latest.json">latest.json</a>' > dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Wait for Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub 的 artifact 列表 API 存在最终一致性延迟：upload 刚 finalized 时，
          # 紧接着的 deploy-pages 可能查到 0 条 metadata 而直接失败。
          # 轮询同一个 API，等 github-pages artifact 可见后再部署。
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "github-pages artifact visible after $((attempt - 1)) retries"
              exit 0
            fi
            sleep 5
          done
          echo "::error::github-pages artifact still not visible after 120s; GitHub artifact API may be degraded"
          exit 1

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
